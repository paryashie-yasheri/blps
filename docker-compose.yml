services:
  pg:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
      - ./docker-postgres-init-scrips:/docker-entrypoint-initdb.d/:ro
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-rewards:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${REWARDS_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5434:5432"
    volumes:
      - pg-rewards-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${REWARDS_POSTGRES_HOST}
      POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-journal:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${JOURNAL_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5433:5432"
    volumes:
      - pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${JOURNAL_POSTGRES_HOST}
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}

    env_file:
      - .env

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
    command: [
      "start-dev",
      "--import-realm"
    ]
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6380:6380"
    command:
      - /bin/sh
      - -c
      - redis-server --port 6380 --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    volumes:
      - cache:/data
    networks:
      - app-network
    env_file:
      - .env

  spring:
    build:
      context: .
      dockerfile: Dockerfile.spring
    ports:
      - "${SPRING_PORT}:${SPRING_PORT}"
    depends_on:
      - pg
      - pg-rewards
      - pg-journal
    networks:
      - app-network
    env_file:
      - .env

  wildfly:
    build:
      context: .
      dockerfile: Dockerfile.wildfly
    ports:
      - "8083:8080"
      - "9991:9990"
    depends_on:
      - pg
      - pg-rewards
      - pg-journal
    networks:
      - app-network
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pg
      POSTGRES_PORT: 5432
      REWARDS_POSTGRES_HOST: pg-rewards
      REWARDS_POSTGRES_PORT: 5432
      JOURNAL_POSTGRES_HOST: pg-journal
      JOURNAL_POSTGRES_PORT: 5432
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      SPRING_PORT: 8080
      PULSAR_SERVICE_URL: pulsar://pulsar:6650

volumes:
  pg-data:
  pg-rewards-data:
  pg-journal-data:
  cache:

networks:
  app-network:
    driver: bridge
