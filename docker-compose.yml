services:
  pg:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-journal:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${JOURNAL_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - 5433:5432
    volumes:
      - pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${JOURNAL_POSTGRES_HOST}
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}

    env_file:
      - .env

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
    command: [
      "start-dev",
      "--import-realm"
    ]
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

  spring:
    build:
      context: .
      dockerfile: Dockerfile.spring
    ports:
      - "${SPRING_PORT}:${SPRING_PORT}"
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

volumes:
  pg-data:

networks:
  app-network:
    driver: bridge
