services:
  pg:
    image: postgres:16.6
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    env_file:
      - .env
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_LOG_LEVEL=INFO
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
    command: [
      "start-dev",
      "--import-realm"
    ]
    depends_on:
      - pg
    networks:
      - app-network

  spring:
    image: blps/backend:jib-dev
    ports:
      - "${SPRING_PORT}:${SPRING_PORT}"
    depends_on:
      - pg
      - keycloak
    networks:
      - app-network
    env_file:
      - .env

volumes:
  pg-data:

networks:
  app-network:
    driver: bridge
