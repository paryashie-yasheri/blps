services:
  pg:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
      - ./docker-postgres-init-scrips:/docker-entrypoint-initdb.d/:ro
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-rewards:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${REWARDS_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5434:5432"
    volumes:
      - pg-rewards-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${REWARDS_POSTGRES_HOST}
      POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-journal:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${JOURNAL_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5433:5432"
    volumes:
      - pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${JOURNAL_POSTGRES_HOST}
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}

    env_file:
      - .env
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    entrypoint: [ "/opt/keycloak/data/import/entrypoint.sh" ]
    environment:
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_LOG_LEVEL=INFO
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
    command: [
      "start-dev",
      "--import-realm",
      "--verbose"
    ]
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

  #  spring:
  #    image: soaring-lizards/blps-main:jib-dev
  #    ports:
  #      - "${SPRING_PORT}:${SPRING_PORT}"
  #    depends_on:
  #      - pg
  #      - pg-rewards
  #      - pg-journal
  #    networks:
  #      - app-network
  #    env_file:
  #      - .env

  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    build: spark/
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001

  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    command: [ "server", "/data", "--console-address", ":9001" ]
  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc policy set public minio/warehouse;
      tail -f /dev/null
      "

volumes:
  pg-data:
  pg-rewards-data:
  pg-journal-data:

networks:
  iceberg_net:

  app-network:
    driver: bridge
