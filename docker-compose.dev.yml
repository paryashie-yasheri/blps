services:
  pg:
    image: postgres:16.6
    container_name: blps-pg-dev
    command: postgres -c max_prepared_transactions=${POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
      - ./docker-postgres-init-scrips:/docker-entrypoint-initdb.d/:ro
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  pg-rewards:
    image: postgres:16.6
    container_name: blps-pg-rewards-dev
    command: postgres -c max_prepared_transactions=${REWARDS_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5434:5432"
    volumes:
      - pg-rewards-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${REWARDS_POSTGRES_HOST}
      POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  pg-journal:
    image: postgres:16.6
    container_name: blps-pg-journal-dev
    command: postgres -c max_prepared_transactions=${JOURNAL_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5433:5432"
    volumes:
      - pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${JOURNAL_POSTGRES_HOST}
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: blps-keycloak-dev
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    entrypoint: [ "/opt/keycloak/data/import/entrypoint.sh" ]
    environment:
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_LOG_LEVEL=INFO
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: [
      "start-dev",
      "--import-realm",
      "--verbose"
    ]
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

  pulsar:
    image: apachepulsar/pulsar:4.0.10
    container_name: blps-pulsar-dev
    command: bin/pulsar standalone --advertised-address localhost
    env_file:
      - .env
    networks:
      - app-network
    ports:
      - "6650:6650"
      - "8082:8080"
    volumes:
      - pulsar-data:/pulsar/data

  promocode-service:
    build:
      context: ./promocode-service
    depends_on:
      - pulsar
    environment:
      PULSAR_URL: ${PROMOCODE_PULSAR_URL}
      PULSAR_TOPIC: ${PULSAR_REWARD_REDEMPTION_TOPIC}
      PULSAR_SUBSCRIPTION: ${PROMOCODE_PULSAR_SUBSCRIPTION}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6380:6380"
    command:
      - /bin/sh
      - -c
      - redis-server --port 6380 --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    volumes:
      - cache:/data
    networks:
      - app-network
    env_file:
      - .env


  #  spring:
  #    image: blps/backend:jib-dev
  #    ports:
  #      - "${SPRING_PORT}:${SPRING_PORT}"
  #    depends_on:
  #      - pg
  #      - pg-rewards
  #      - pg-journal
  #    networks:
  #      - app-network
  #    env_file:
  #      - .env

  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: blps-spark-iceberg-dev
    networks: [ app-network ]
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rest:
    image: apache/iceberg-rest-fixture
    container_name: blps-iceberg-rest-dev
    networks: [ app-network ]
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
  minio:
    image: minio/minio
    container_name: blps-minio-dev
    networks:
      app-network:
        aliases:
          - warehouse.minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc
    container_name: blps-mc-dev
    networks: [ app-network ]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for minio...';
      for i in $(seq 1 30); do
        if /usr/bin/mc alias set minio http://minio:9000 admin password 2>/dev/null; then
          echo 'Connected to minio';
          break;
        fi;
        echo 'Waiting...';
        sleep 2;
      done;
      /usr/bin/mc mb minio/warehouse 2>/dev/null || true;
      /usr/bin/mc policy set public minio/warehouse;
      echo 'Bucket ready';
      tail -f /dev/null
      "
    depends_on:
      minio:
        condition: service_healthy

  datalake-sync:
    build:
      context: ./datalake-sync
      dockerfile: Dockerfile
    container_name: blps-datalake-sync-dev
    networks: [ app-network ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-journal:5432/studs_journal
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DATALAKE_SPARK__CONTAINER: blps-spark-iceberg-dev
      DATALAKE_SPARK__CATALOG__URI: http://rest:8181
      DATALAKE_SPARK__S3__ENDPOINT: http://minio:9000
      DATALAKE_SPARK__S3__ACCESS-KEY: admin
      DATALAKE_SPARK__S3__SECRET-KEY: password
      DATALAKE_LEDGER__DB__URL: jdbc:postgresql://pg-journal:5432/studs_journal
      DATALAKE_LEDGER__DB__USERNAME: postgres
      DATALAKE_LEDGER__DB__PASSWORD: postgres
      DATALAKE_QUARTZ__ENABLED: "true"
      JAVA_OPTS: -Xmx256m
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090;echo -e \"GET /actuator/health HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200\" <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      rest:
        condition: service_healthy
      spark-iceberg:
        condition: service_healthy
      pg-journal:
        condition: service_healthy

volumes:
  pg-data:
  pg-rewards-data:
  pg-journal-data:
  pulsar-data:
  cache:

networks:
  app-network:
    driver: bridge
