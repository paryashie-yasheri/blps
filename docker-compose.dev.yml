services:
  pg:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
      - ./docker-postgres-init-scrips:/docker-entrypoint-initdb.d/:ro
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: studs
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-rewards:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${REWARDS_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5434:5432"
    volumes:
      - pg-rewards-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${REWARDS_POSTGRES_HOST}
      POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}

    env_file:
      - .env

  pg-journal:
    image: postgres:16.6
    command: postgres -c max_prepared_transactions=${JOURNAL_POSTGRES_MAX_PREPARED_TRANSACTIONS:-100}
    networks:
      - app-network
    shm_size: 128mb
    ports:
      - "5433:5432"
    volumes:
      - pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      DB_CONNECTION: pgsql
      POSTGRES_HOST: ${JOURNAL_POSTGRES_HOST}
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}

    env_file:
      - .env
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    entrypoint: [ "/opt/keycloak/data/import/entrypoint.sh" ]
    environment:
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_LOG_LEVEL=INFO
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
      - KC_LOG_LEVEL_ORG_KEYCLOAK=DEBUG
    command: [
      "start-dev",
      "--import-realm",
      "--verbose"
    ]
    depends_on:
      - pg
    networks:
      - app-network
    env_file:
      - .env

  pulsar:
    image: apachepulsar/pulsar:4.0.10
    container_name: pulsar
    command: bin/pulsar standalone --advertised-address localhost
    env_file:
      - .env
    networks:
      - app-network
    ports:
      - "6650:6650"
      - "8082:8080"
    volumes:
      - pulsar-data:/pulsar/data

  promocode-service:
    build:
      context: ./promocode-service
    profiles:
      - promocode
    depends_on:
      - pulsar
    environment:
      PULSAR_URL: ${PROMOCODE_PULSAR_URL:-pulsar://pulsar:6650}
      PULSAR_TOPIC: ${PULSAR_REWARD_REDEMPTION_TOPIC:-persistent://public/default/reward-redemptions}
      PULSAR_SUBSCRIPTION: ${PROMOCODE_PULSAR_SUBSCRIPTION:-promocode-service}
      REDIS_ADDR: ${REDIS_ADDR:localhost:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:""}
      REDIS_DB: ${REDIS_DB:0}
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    volumes:
      - cache:/data
    env_file:
      - .env


