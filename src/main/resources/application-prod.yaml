spring:
  config:
    activate:
      on-profile: prod

  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:studs}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      pool-name: MainHikariCP
      max-lifetime: 1800000

  jooq:
    sql-dialect: ${SPRING_JOOQ_SQL_DIALECT:POSTGRES}

  security:
    oauth2:
      authorization-server:
        issuer: ${SPRING_SECURITY_OAUTH2_AUTHORIZATION_SERVER_ISSUER_URL:http://localhost:8080/oauth2}

logging:
  level:
    root: INFO
    soaringLizards: INFO
    com.atomikos: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
