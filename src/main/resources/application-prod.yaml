spring:
  config:
    activate:
      on-profile: prod
  liquibase:
    enabled: true

  security:
    admin-credentials:
      username: ${KEYCLOAK_ADMIN}
      password: ${KEYCLOAK_ADMIN_PASSWORD}
      email: ${KEYCLOAK_ADMIN_EMAIL}

edx:
  api:
    base-url: "http://local.openedx.io/api"
    admin-username: ${EDX_API_ADMIN_USERNAME:admin}
    admin-password: ${EDX_API_ADMIN_PASSWORD:admin}
