spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    enabled: true

  application:
    name: blps
  security:
    admin-credentials:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      email: ${ADMIN_EMAIL:admin@mail.com}

      oauth2:
        authorization-server:
          issuer-url: "${SPRING_HOST}"
          introspection-endpoint: /oauth2/token-info
          jwt-secret: "${JWT_SECRET}"
          scopes: [ "read.scope", "write.scope" ]
          redirect-uri: "http://127.0.0.1:8080/code"
          client-secret: "{noop}${AUTH_SERVER_CLIENT_SECRET}"
          client-name: "blps-stuff-auth"
          client-id: "blps-stuff-auth"

  oauth2:
    client:
      registration:
        edx:
          client-id: ${LMS_CLIENT_ID}
          client-secret: ${LMS_CLIENT_SECRET}

logging:
  level:
    org.springframework.security: DEBUG
    soaringLizards.blps: DEBUG

edx:
  api:
    base-url: "http://local.openedx.io/api"
    username: ${EDX_API_USERNAME:admin}
    password: ${EDX_API_PASSWORD:admin}
