spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    enabled: true

  application:
    name: blps
  security:
    admin-credentials:
      username: ${KEYCLOAK_ADMIN}
      password: ${KEYCLOAK_ADMIN_PASSWORD}
      email: ${KEYCLOAK_ADMIN_EMAIL}

  oauth2:
    client:
      registration:
        edx:
          client-id: ${LMS_CLIENT_ID}
          client-secret: ${LMS_CLIENT_SECRET}

logging:
  level:
    org.springframework.security: DEBUG
    soaringLizards.blps: DEBUG

edx:
  api:
    base-url: "${LMS_URL}/api"
    admin-username: ${EDX_API_ADMIN_USERNAME:admin}
    admin-password: ${EDX_API_ADMIN_PASSWORD:admin}

