server:
  port: ${SPRING_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: blps
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:studs}?currentSchema=${POSTGRES_SCHEMA:public}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true
  jooq:
    sql-dialect: POSTGRES
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
auth:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

edx:
  api:
    base-url: ${EDX_API_BASE_URL:http://local.openedx.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}
