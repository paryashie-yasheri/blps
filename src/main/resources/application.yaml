server:
  port: ${SPRING_PORT:8080}
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: dev
  application:
    name: blps
  liquibase:
    change-log: classpath:db/main/db.main.changelog-master.yaml
    enabled: true
    default-schema: ${POSTGRES_SCHEMA:public}
    liquibase-schema: ${POSTGRES_SCHEMA:public}
  jooq:
    sql-dialect: POSTGRES
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  env:
    config:
      port: ${server.port}
      host: ${SPRING_HOST:"http://localhost:${server.port}/"}

app:
  pulsar:
    enabled: ${PULSAR_ENABLED:true}
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    reward-redemption-topic: ${PULSAR_REWARD_REDEMPTION_TOPIC:persistent://public/default/reward-redemptions}
    producer-name: ${PULSAR_REWARD_REDEMPTION_PRODUCER_NAME:blps-reward-redemptions}
    send-timeout-ms: ${PULSAR_SEND_TIMEOUT_MS:3000}
  datasource:
    xa:
      main:
        host: ${POSTGRES_HOST:localhost}
        port: ${POSTGRES_PORT:5432}
        database: ${POSTGRES_DB:studs}
        username: ${POSTGRES_USER:}
        password: ${POSTGRES_PASSWORD:}
        schema: ${POSTGRES_SCHEMA:public}
        unique-resource-name: ${POSTGRES_XA_RESOURCE_NAME:main-postgres-xa}
        min-pool-size: ${POSTGRES_XA_MIN_POOL_SIZE:1}
        max-pool-size: ${POSTGRES_XA_MAX_POOL_SIZE:8}
        borrow-connection-timeout-seconds: ${POSTGRES_XA_BORROW_TIMEOUT_SECONDS:5}
        maintenance-interval-seconds: ${POSTGRES_XA_MAINTENANCE_INTERVAL_SECONDS:60}
        max-idle-time-seconds: ${POSTGRES_XA_MAX_IDLE_TIME_SECONDS:60}
        test-query: ${POSTGRES_XA_TEST_QUERY:SELECT 1}
        startup-check-enabled: ${POSTGRES_STARTUP_CHECK_ENABLED:true}
        required-on-startup: ${POSTGRES_REQUIRED_ON_STARTUP:true}
        startup-check-timeout-seconds: ${POSTGRES_STARTUP_CHECK_TIMEOUT_SECONDS:3}
      journal:
        host: ${JOURNAL_POSTGRES_HOST:${POSTGRES_HOST:localhost}}
        port: ${JOURNAL_POSTGRES_PORT:${POSTGRES_PORT:5432}}
        database: ${JOURNAL_POSTGRES_DB:studs_journal}
        username: ${JOURNAL_POSTGRES_USER:${POSTGRES_USER:}}
        password: ${JOURNAL_POSTGRES_PASSWORD:${POSTGRES_PASSWORD:}}
        schema: ${JOURNAL_POSTGRES_SCHEMA:public}
        unique-resource-name: ${JOURNAL_POSTGRES_XA_RESOURCE_NAME:journal-postgres-xa}
        min-pool-size: ${JOURNAL_POSTGRES_XA_MIN_POOL_SIZE:1}
        max-pool-size: ${JOURNAL_POSTGRES_XA_MAX_POOL_SIZE:8}
        borrow-connection-timeout-seconds: ${JOURNAL_POSTGRES_XA_BORROW_TIMEOUT_SECONDS:5}
        maintenance-interval-seconds: ${JOURNAL_POSTGRES_XA_MAINTENANCE_INTERVAL_SECONDS:60}
        max-idle-time-seconds: ${JOURNAL_POSTGRES_XA_MAX_IDLE_TIME_SECONDS:60}
        test-query: ${JOURNAL_POSTGRES_XA_TEST_QUERY:SELECT 1}
        startup-check-enabled: ${JOURNAL_POSTGRES_STARTUP_CHECK_ENABLED:true}
        required-on-startup: ${JOURNAL_POSTGRES_REQUIRED_ON_STARTUP:false}
        startup-check-timeout-seconds: ${JOURNAL_POSTGRES_STARTUP_CHECK_TIMEOUT_SECONDS:3}
      rewards:
        host: ${REWARDS_POSTGRES_HOST:${POSTGRES_HOST:localhost}}
        port: ${REWARDS_POSTGRES_PORT:${POSTGRES_PORT:5432}}
        database: ${REWARDS_POSTGRES_DB:studs_rewards}
        username: ${REWARDS_POSTGRES_USER:${POSTGRES_USER:}}
        password: ${REWARDS_POSTGRES_PASSWORD:${POSTGRES_PASSWORD:}}
        schema: ${REWARDS_POSTGRES_SCHEMA:public}
        unique-resource-name: ${REWARDS_POSTGRES_XA_RESOURCE_NAME:rewards-postgres-xa}
        min-pool-size: ${REWARDS_POSTGRES_XA_MIN_POOL_SIZE:1}
        max-pool-size: ${REWARDS_POSTGRES_XA_MAX_POOL_SIZE:8}
        borrow-connection-timeout-seconds: ${REWARDS_POSTGRES_XA_BORROW_TIMEOUT_SECONDS:5}
        maintenance-interval-seconds: ${REWARDS_POSTGRES_XA_MAINTENANCE_INTERVAL_SECONDS:60}
        max-idle-time-seconds: ${REWARDS_POSTGRES_XA_MAX_IDLE_TIME_SECONDS:60}
        test-query: ${REWARDS_POSTGRES_XA_TEST_QUERY:SELECT 1}
        startup-check-enabled: ${REWARDS_POSTGRES_STARTUP_CHECK_ENABLED:true}
        required-on-startup: ${REWARDS_POSTGRES_REQUIRED_ON_STARTUP:false}
        startup-check-timeout-seconds: ${REWARDS_POSTGRES_STARTUP_CHECK_TIMEOUT_SECONDS:3}
  atomikos:
    log-base-dir: ${ATOMIKOS_LOG_BASE_DIR:${java.io.tmpdir}/blps-atomikos}
    tm-unique-name: ${ATOMIKOS_TM_UNIQUE_NAME:${spring.application.name}-tm}
    transaction-timeout-seconds: ${ATOMIKOS_TRANSACTION_TIMEOUT_SECONDS:30}
    max-timeout-seconds: ${ATOMIKOS_MAX_TIMEOUT_SECONDS:60}
    checkpoint-interval: ${ATOMIKOS_CHECKPOINT_INTERVAL:500}
    threaded-2pc: ${ATOMIKOS_THREADED_2PC:true}
    enable-logging: ${ATOMIKOS_ENABLE_LOGGING:true}
    force-shutdown: ${ATOMIKOS_FORCE_SHUTDOWN:false}
  journal:
    liquibase:
      change-log: classpath:db/journal/db.journal.changelog-master.yaml
      enabled: ${JOURNAL_LIQUIBASE_ENABLED:true}
      default-schema: ${JOURNAL_POSTGRES_SCHEMA:public}
      liquibase-schema: ${JOURNAL_POSTGRES_SCHEMA:public}
  rewards:
    liquibase:
      change-log: classpath:db/rewards/db.rewards.changelog-master.yaml
      enabled: ${REWARDS_LIQUIBASE_ENABLED:true}
      default-schema: ${REWARDS_POSTGRES_SCHEMA:public}
      liquibase-schema: ${REWARDS_POSTGRES_SCHEMA:public}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  admin:
    username: ${KEYCLOAK_ADMIN}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  master:
    realm: ${KEYCLOAK_MASTER_REALM}
    client-id: ${KEYCLOAK_MASTER_CLIENT_ID}
    client-secret: ${KEYCLOAK_MASTER_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}

# noinspection SpringBootApplicationYaml
aws:
  s3:
    region: ${S3_REGION:en}
    endpoint: ${S3_ENDPOINT:example.com}
    tenant-id: ${S3_TENANT_ID:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    access-key: ${S3_ACCESS_KEY:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    secret-key: ${S3_SECRET_KEY:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    bucket: ${S3_BUCKET:bucket}

# turn off `jooq's tip of the day`
logging:
  level:
    org.jooq.Constants: OFF
