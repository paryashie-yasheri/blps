server:
  port: ${SPRING_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: blps
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true
  jooq:
    sql-dialect: POSTGRES
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  env:
    config:
      port: ${server.port}
      host: ${SPRING_HOST:"http://localhost:${server.port}/"}

app:
  datasource:
    xa:
      host: ${POSTGRES_HOST:localhost}
      port: ${POSTGRES_PORT:5432}
      database: ${POSTGRES_DB:studs}
      username: ${POSTGRES_USER:}
      password: ${POSTGRES_PASSWORD:}
      schema: ${POSTGRES_SCHEMA:public}
      unique-resource-name: ${POSTGRES_XA_RESOURCE_NAME:main-postgres-xa}
      min-pool-size: ${POSTGRES_XA_MIN_POOL_SIZE:1}
      max-pool-size: ${POSTGRES_XA_MAX_POOL_SIZE:8}
      borrow-connection-timeout-seconds: ${POSTGRES_XA_BORROW_TIMEOUT_SECONDS:30}
      maintenance-interval-seconds: ${POSTGRES_XA_MAINTENANCE_INTERVAL_SECONDS:60}
      max-idle-time-seconds: ${POSTGRES_XA_MAX_IDLE_TIME_SECONDS:60}
      test-query: ${POSTGRES_XA_TEST_QUERY:SELECT 1}
  atomikos:
    log-base-dir: ${ATOMIKOS_LOG_BASE_DIR:${java.io.tmpdir}/blps-atomikos}
    tm-unique-name: ${ATOMIKOS_TM_UNIQUE_NAME:${spring.application.name}-tm}
    transaction-timeout-seconds: ${ATOMIKOS_TRANSACTION_TIMEOUT_SECONDS:30}

auth:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

edx:
  api:
    base-url: ${EDX_API_BASE_URL:http://local.openedx.io/api}
    username: ${EDX_API_USERNAME:}
    password: ${EDX_API_PASSWORD:}
    authorization: ${EDX_API_AUTHORIZATION:}
    cookie: ${EDX_API_COOKIE:}
    csrf-token: ${EDX_API_CSRF_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}

# noinspection SpringBootApplicationYaml
aws:
  s3:
    region: ${S3_REGION:en}
    endpoint: ${S3_ENDPOINT:example.com}
    tenant-id: ${S3_TENANT_ID:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    access-key: ${S3_ACCESS_KEY:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    secret-key: ${S3_SECRET_KEY:0fb18b9b-c15f-465f-a346-09f816f4fae7}
    bucket: ${S3_BUCKET:bucket}
