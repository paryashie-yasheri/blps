spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5433/studs_journal
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

server:
  port: 8091

datalake:
  spark:
    container: spark-iceberg
    catalog:
      name: demo
      uri: http://rest:8181
    warehouse:
      uri: s3://warehouse/
    s3:
      endpoint: http://minio:9000
      access-key: admin
      secret-key: password
  quartz:
    enabled: false
