spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8090

datalake:
  spark:
    create-test-table: false
    container: spark-iceberg
    catalog:
      name: demo
      uri: ${CATALOG_URI:http://rest:8181}
    warehouse:
      uri: ${WAREHOUSE_URI:s3://warehouse/}
    s3:
      endpoint: ${S3_ENDPOINT:http://minio:9000}
      access-key: ${AWS_ACCESS_KEY_ID:admin}
      secret-key: ${AWS_SECRET_ACCESS_KEY:password}
