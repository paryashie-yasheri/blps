services:
  pg:
    image: postgres:16.6
    container_name: blps-pg-prod
    command: postgres -c max_prepared_transactions=100
    networks: [ app-network ]
    ports:
      - "5432:5432"
    shm_size: 128mb
    volumes:
      - prod-pg-data:/var/lib/postgresql/data:Z
      - ./docker-postgres-init-scrips:/docker-entrypoint-initdb.d/:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  pg-rewards:
    image: postgres:16.6
    container_name: blps-pg-rewards-prod
    command: postgres -c max_prepared_transactions=100
    networks: [ app-network ]
    shm_size: 128mb
    volumes:
      - prod-pg-rewards-data:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  pg-journal:
    image: postgres:16.6
    container_name: blps-pg-journal-prod
    command: postgres -c max_prepared_transactions=100
    networks: [ app-network ]
    shm_size: 128mb
    volumes:
      - prod-pg-journal-data:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: blps-keycloak-prod
    networks: [ app-network ]
    env_file:
      - .env
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    entrypoint: [ "/opt/keycloak/data/import/entrypoint.sh" ]
    environment:
      - KEYCLOAK_IMPORT=/tmp/realm-config.json
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_LOG_LEVEL=WARN
    command: [
      "start-dev",
      "--import-realm"
    ]
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      pg:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: blps-spark-iceberg-prod
    networks:
      - app-network
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  minio:
    image: minio/minio
    container_name: blps-minio-prod
    networks:
      app-network:
        aliases:
          - warehouse.minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc
    container_name: blps-mc-prod
    networks:
      - app-network
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for minio...';
      for i in $(seq 1 30); do
        if /usr/bin/mc alias set minio http://minio:9000 admin password 2>/dev/null; then
          echo 'Connected to minio';
          break;
        fi;
        echo 'Waiting...';
        sleep 2;
      done;
      /usr/bin/mc mb minio/warehouse 2>/dev/null || true;
      /usr/bin/mc policy set public minio/warehouse;
      echo 'Bucket ready';
      tail -f /dev/null
      "
    depends_on:
      minio:
        condition: service_healthy

  rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: blps-iceberg-rest-prod
    networks:
      - app-network
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_FORCE_PATH_STYLE: "true"
      AWS_LOG_LEVEL: debug
    ports:
      - "8181:8181"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8181/v1/config || exit 1" ]
      interval: 1s
      timeout: 5s
      retries: 10
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_started

  spring:
    image: soaring-lizards/blps-main:jib-dev
    container_name: blps-spring-prod
    networks: [ app-network ]
    env_file:
      - .env
    ports:
      - "${SPRING_PORT:-8080}:${SPRING_PORT:-8080}"
    environment:
      POSTGRES_HOST: pg
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REWARDS_POSTGRES_HOST: pg-rewards
      REWARDS_POSTGRES_PORT: 5432
      REWARDS_POSTGRES_DB: ${REWARDS_POSTGRES_DB}
      REWARDS_POSTGRES_USER: ${REWARDS_POSTGRES_USER}
      REWARDS_POSTGRES_PASSWORD: ${REWARDS_POSTGRES_PASSWORD}
      JOURNAL_POSTGRES_HOST: pg-journal
      JOURNAL_POSTGRES_PORT: 5432
      JOURNAL_POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      JOURNAL_POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      JOURNAL_POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JOURNAL_LIQUIBASE_ENABLED: "true"
      ATOMIKOS_LOG_BASE_DIR: /tmp/atomikos
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /actuator/health HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200\" <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      pg:
        condition: service_healthy
      pg-rewards:
        condition: service_healthy
      pg-journal:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  datalake-sync:
    build:
      context: ./datalake-sync
      dockerfile: Dockerfile
    container_name: blps-datalake-sync-prod
    networks: [ app-network ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-journal:${JOURNAL_POSTGRES_PORT}/${JOURNAL_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${JOURNAL_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
      DATALAKE_SPARK__CONTAINER: blps-spark-iceberg-prod
      DATALAKE_SPARK__CATALOG__URI: http://rest:8181
      DATALAKE_SPARK__S3__ENDPOINT: http://minio:9000
      DATALAKE_SPARK__S3__ACCESS-KEY: admin
      DATALAKE_SPARK__S3__SECRET-KEY: password
      DATALAKE_LEDGER__DB__URL: jdbc:postgresql://pg-journal:${JOURNAL_POSTGRES_PORT}/${JOURNAL_POSTGRES_DB}
      DATALAKE_LEDGER__DB__USERNAME: ${JOURNAL_POSTGRES_USER}
      DATALAKE_LEDGER__DB__PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
      DATALAKE_QUARTZ__ENABLED: "true"
      JAVA_OPTS: -Xmx256m
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090;echo -e \"GET /actuator/health HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200\" <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      rest:
        condition: service_healthy
      spark-iceberg:
        condition: service_healthy
      pg-journal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  prod-pg-data:
  prod-pg-rewards-data:
  prod-pg-journal-data:

networks:
  app-network:
    driver: bridge
