name: Gradle Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add my openapi
        run: echo "46.16.36.172  local.openedx.io" | sudo tee -a /etc/hosts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup and build project
        run: ./gradlew codegen bootjar

      - name: Run tests
        run: ./gradlew test --no-daemon

  go-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: promocode-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: promocode-service/go.mod
          cache-dependency-path: promocode-service/go.sum

      - name: Run Go tests
        run: go test ./...
